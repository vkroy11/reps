# Render blueprint for the Reps API.
#
# Committed rather than configured in the dashboard so the deploy is
# reproducible and reviewable: the build command, the health check and the full
# list of variables the service needs are all visible in the repo.
#
# Create it with: Render dashboard -> New -> Blueprint -> pick this repo.
# Render prompts for every `sync: false` value, so no secret is stored here.
services:
  - type: web
    name: reps-api
    runtime: node
    plan: free
    # Postgres lives on Neon, so pick the Render region closest to the Neon
    # project - every request pays that round trip twice.
    region: oregon
    healthCheckPath: /api/health

    # The build is one script in package.json rather than four commands here,
    # so the same definition serves the blueprint and a hand-made service - and
    # so nobody has to paste a 200-character line into a web form, which is how
    # a deploy ends up running `npm` and nothing else.
    #
    # `-w @reps/api --include-workspace-root` is load-bearing. A plain `npm ci`
    # installs every workspace, and apps/mobile pulls in Expo and React Native:
    # 6.3 GB of node_modules for a service that needs 373 MB of it. Scoping the
    # install to the API and the root still links @reps/core, because npm
    # resolves workspace dependencies of the workspace it was asked for.
    #
    # `--include=dev` because prisma and tsup are devDependencies and NODE_ENV
    # is production here, which would otherwise skip them.
    #
    # Migrations run at build, not at start: a bad migration then fails the
    # deploy while the previous release is still serving, and cold starts stay
    # fast. Every migration in this repo is additive, so the schema being one
    # release ahead of the code for a moment is safe.
    buildCommand: npm run build:render
    startCommand: npm run start -w @reps/api

    envVars:
      # The root package.json says `engines: >=20`, which Render reads as
      # "newest available" - it picked 26. That works (the whole build and boot
      # were verified on 26.8.1), but "newest available" is not a version: the
      # runtime could change under the deploy without anything in the repo
      # changing. 22 is what tsup targets, so it is the one to pin to.
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production

      # Neon connection string, pooled. Include `?sslmode=require`.
      - key: DATABASE_URL
        sync: false

      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false

      # Generated by Render and never seen by anyone. Required in production:
      # the API refuses to boot without it, because a random per-process key
      # would sign every learner out on each restart.
      - key: SESSION_SECRET
        generateValue: true

      - key: AUTH_PROVIDER
        value: google
      # Optional. Leave unset and the app works fully, saying only that
      # cross-device sync is unavailable in this build. Add the three OAuth
      # client ids (web, iOS, Android), comma separated, to switch sign-in on.
      # - key: GOOGLE_OAUTH_CLIENT_IDS
      #   sync: false
